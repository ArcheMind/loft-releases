name: Sync Loft manual release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-loft-manual-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_BASE_URL: https://loft.archemind.org/updates/manual
      GH_REPO: ArcheMind/loft-releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Read source release metadata
        id: release
        run: |
          curl --fail --location --retry 6 --retry-delay 5 \
            "${SOURCE_BASE_URL}/release.json" \
            --output "${RUNNER_TEMP}/source-release.json"
          node scripts/prepare-release.mjs metadata "${RUNNER_TEMP}/source-release.json"

      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download and verify native release assets
        if: steps.existing.outputs.exists != 'true'
        run: |
          node scripts/prepare-release.mjs assets \
            "${RUNNER_TEMP}/source-release.json" "${RUNNER_TEMP}/loft-release"
          cp assets/loft-icon.png "${RUNNER_TEMP}/loft-release/Loft-icon.png"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GH_REPO}" \
            --target "${GITHUB_SHA}" \
            --title "Loft ${RELEASE_VERSION} · Manual Beta" \
            --notes-file "${RUNNER_TEMP}/loft-release/RELEASE_NOTES.md" \
            "${RUNNER_TEMP}"/loft-release/Loft-manual-latest-{arm64,x64}.{dmg,zip} \
            "${RUNNER_TEMP}/loft-release/release.json" \
            "${RUNNER_TEMP}/loft-release/INSTALL.txt" \
            "${RUNNER_TEMP}/loft-release/Loft-icon.png"

      - name: Verify anonymous downloads
        if: steps.existing.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          for asset in \
            Loft-manual-latest-{arm64,x64}.{dmg,zip} \
            release.json \
            Loft-icon.png
          do
            curl --fail --location --head --retry 12 --retry-delay 5 \
              "https://github.com/ArcheMind/loft-releases/releases/download/${RELEASE_TAG}/${asset}"
          done
